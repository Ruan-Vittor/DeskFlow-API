spring:
  datasource:
    url: jdbc:h2:mem:deskflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never

deskflow:
  jwt:
    secret: test-only-secret-key-with-more-than-thirty-two-characters-123456
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:3000
  bootstrap:
    admin:
      name: Administrador
      email:
      password:

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.deskflow: WARN
    org.springframework: WARN
